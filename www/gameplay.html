<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NORVYX · GAMEPLAY</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --cy:#22e6ff;--vi:#a05cff;--rd:#ff3b6b;--or:#ff6b3b;
  --elite:#ffe34d;
  --bg:#04060f;--ink:rgba(234,244,255,.92);--ink2:rgba(234,244,255,.46);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --gap-sm:6px;--r-sm:8px;--r-md:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:var(--bg);touch-action:none;overscroll-behavior:none;font-family:'IBM Plex Mono',monospace;}
#stage{position:fixed;inset:0;}
#gc{display:block;width:100%;height:100%;touch-action:none;}

/* ══════════════════════════════════════
   WEAPON HUD — Sol taraf, gerçek oyunla birebir
══════════════════════════════════════ */
#weapon-hud{
  position:absolute;
  left:10px;right:auto;
  top:calc(var(--safe-t) + 196px);
  z-index:7;
  display:flex;flex-direction:column;gap:5px;
  pointer-events:none;
}
.weapon-pill{
  width:48px;min-width:48px;height:38px;
  padding:3px 2px;border-radius:10px;
  background:rgba(5,10,24,.68);
  border:1px solid rgba(160,92,255,.28);
  text-align:center;font-size:8px;font-weight:900;
  letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink);
  box-shadow:0 0 10px rgba(34,230,255,.04);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
.weapon-pill .wp-name{font-size:8px;font-weight:900;color:var(--ink);}
.weapon-pill .wp-lv{font-size:7px;color:var(--ink2);}
.weapon-pill .wp-cd{
  font-size:7px;font-weight:600;
  width:100%;text-align:center;
  position:relative;overflow:hidden;border-radius:3px;
}
.weapon-pill .wp-cd-bar{
  position:absolute;left:0;top:0;bottom:0;
  background:rgba(34,230,255,.18);
  transition:width .1s linear;
}
.weapon-pill .wp-cd-txt{position:relative;z-index:1;}
/* Pulse */
#w-pulse{border-color:rgba(34,230,255,.4);}
#w-pulse .wp-name{color:#22e6ff;}
/* Plasma */
#w-plasma{border-color:rgba(255,90,54,.35);}
#w-plasma .wp-name{color:#ff6b3b;}
/* Arc */
#w-arc{border-color:rgba(155,77,255,.45);}
#w-arc .wp-name{color:#b57aff;}
/* Nova */
#w-nova{border-color:rgba(255,107,59,.3);}
#w-nova .wp-name{color:#ff8a5a;}

/* ══════════════════════════════════════
   POWER HUD — Sağ taraf, aktif güçler
══════════════════════════════════════ */
#power-hud{
  position:absolute;
  right:10px;left:auto;
  top:calc(var(--safe-t) + 280px);
  z-index:7;
  display:flex;flex-direction:column;align-items:flex-end;gap:var(--gap-sm);
  pointer-events:none;
}
.power-pill{
  min-width:70px;height:34px;padding:0 9px;
  border-radius:10px;
  background:rgba(5,10,24,.6);border:1px solid rgba(34,230,255,.22);
  text-align:center;font-size:8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  display:none;align-items:center;justify-content:center;gap:5px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.power-pill.on{display:flex;}
#p-shield{color:#48d9ff;border-color:rgba(72,217,255,.5);}
#p-magnet{color:#ff54d9;border-color:rgba(255,84,217,.5);}
#p-overdrive{color:var(--elite);border-color:rgba(255,227,77,.5);}

/* ══════════════════════════════════════
   HULL BAR — Sol alt
══════════════════════════════════════ */
#hull-hud{
  position:absolute;
  left:calc(var(--safe-l) + 16px);
  right:calc(var(--safe-r) + 100px);
  bottom:calc(var(--safe-b) + 18px);
  z-index:7;pointer-events:none;
}
.hull-label{font-size:7px;color:var(--ink2);letter-spacing:2px;margin-bottom:4px;font-family:'Chakra Petch',sans-serif;}
.hull-track{height:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
#hull-fill{height:100%;background:linear-gradient(90deg,#00ff7a,#22e6ff);border-radius:3px;box-shadow:0 0 6px rgba(0,255,120,.4);transition:width .12s linear;}
.hull-val{font-size:7px;color:var(--ink2);margin-top:3px;letter-spacing:1px;}

/* ══════════════════════════════════════
   DASH BUTTON — Sağ alt, gerçek oyunla birebir
══════════════════════════════════════ */
#b-dash{
  position:absolute;
  right:calc(var(--safe-r) + 18px);
  bottom:calc(var(--safe-b) + 18px);
  width:64px;height:64px;
  z-index:9;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:0;padding:0;
  background:
    conic-gradient(#7fe0ff var(--cd,0%), rgba(255,255,255,.10) var(--cd,0%)),
    radial-gradient(circle at 42% 36%, rgba(127,224,255,.22), rgba(4,8,18,.92) 68%);
  color:#cdf2ff;
  box-shadow:0 4px 16px rgba(0,0,0,.45);
  touch-action:none;cursor:pointer;
}
#b-dash::before{
  content:"";position:absolute;inset:5px;border-radius:50%;
  background:radial-gradient(circle at 44% 38%, rgba(20,34,62,.96), rgba(5,9,20,.96));
  border:1px solid rgba(127,224,255,.30);
}
#b-dash .dash-i{position:relative;font-size:23px;line-height:1;font-weight:900;
  text-shadow:0 0 12px rgba(127,224,255,.7);opacity:.55;transition:opacity 140ms;}
#b-dash .dash-cd{position:absolute;font-size:13px;font-weight:900;
  color:var(--ink);font-variant-numeric:tabular-nums;}
#b-dash.rdy{box-shadow:0 0 20px rgba(127,224,255,.42),0 4px 16px rgba(0,0,0,.45);}
#b-dash.rdy .dash-i{opacity:1;}
#b-dash:active{transform:scale(.94);}

/* ══════════════════════════════════════
   WAVE / SECTOR banner — üst orta
══════════════════════════════════════ */
#wave-banner{
  position:absolute;
  top:calc(var(--safe-t) + 8px);
  left:50%;transform:translateX(-50%);
  z-index:7;pointer-events:none;
  text-align:center;white-space:nowrap;
}
.wb-sector{font-family:'Chakra Petch',sans-serif;font-size:9px;font-weight:700;color:var(--cy);letter-spacing:3px;text-shadow:0 0 8px rgba(34,230,255,.6);}
.wb-wave{font-size:7px;color:var(--ink2);letter-spacing:2px;margin-top:1px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gc" aria-label="NORVYX gameplay" role="application"></canvas>
</div>

<!-- WEAPON HUD (Sol — otomatik silahlar) -->
<div id="weapon-hud">
  <div class="weapon-pill" id="w-pulse">
    <div class="wp-name">PULSE</div>
    <div class="wp-lv">Lv.1</div>
    <div class="wp-cd"><div class="wp-cd-bar" id="wcd-pulse"></div><span class="wp-cd-txt">AUTO</span></div>
  </div>
  <div class="weapon-pill" id="w-plasma">
    <div class="wp-name">PLASMA</div>
    <div class="wp-lv">Lv.1</div>
    <div class="wp-cd"><div class="wp-cd-bar" id="wcd-plasma"></div><span class="wp-cd-txt" id="wct-plasma">AUTO</span></div>
  </div>
  <div class="weapon-pill" id="w-arc">
    <div class="wp-name">ARC</div>
    <div class="wp-lv">Lv.1</div>
    <div class="wp-cd"><div class="wp-cd-bar" id="wcd-arc"></div><span class="wp-cd-txt" id="wct-arc">AUTO</span></div>
  </div>
  <div class="weapon-pill" id="w-nova">
    <div class="wp-name">NOVA</div>
    <div class="wp-lv">Lv.1</div>
    <div class="wp-cd"><div class="wp-cd-bar" id="wcd-nova"></div><span class="wp-cd-txt" id="wct-nova">5.8s</span></div>
  </div>
</div>

<!-- POWER HUD (Sağ — aktif güçler) -->
<div id="power-hud">
  <div class="power-pill" id="p-shield"><span>🛡</span><span>SHIELD</span></div>
  <div class="power-pill" id="p-magnet"><span>✦</span><span>MAGNET</span></div>
  <div class="power-pill" id="p-overdrive"><span>⚡</span><span>OVERDRIVE</span></div>
</div>

<!-- HULL BAR (Sol alt) -->
<div id="hull-hud">
  <div class="hull-label">HULL</div>
  <div class="hull-track"><div id="hull-fill" style="width:100%"></div></div>
  <div class="hull-val" id="hull-val">100 / 100</div>
</div>

<!-- DASH BUTTON (Sağ alt) -->
<button id="b-dash" class="rdy" aria-label="Dash">
  <span class="dash-i">↯</span>
  <span class="dash-cd" id="dash-cd-txt"></span>
</button>

<!-- WAVE BANNER (Üst orta) -->
<div id="wave-banner">
  <div class="wb-sector">SECTOR 01</div>
  <div class="wb-wave" id="wave-lbl">WAVE 01 · 0 / 25</div>
</div>
