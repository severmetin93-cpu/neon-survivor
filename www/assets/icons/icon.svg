<?xml version="1.0" encoding="UTF-8"?>
<!--
  NEON SURVIVOR - tek kaynak ikon.
  CI bu dosyadan Android launcher ikonlarini uretir.

  DIKKAT:
  id="bg" ve id="mark" isimlerini degistirme.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024"
     height="1024">

  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#223C8C" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#12224F" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#04060F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAF4FF" stop-opacity="1"/>
      <stop offset="45%" stop-color="#22E6FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22E6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ARKA PLAN -->
  <g id="bg">
    <rect
      x="0"
      y="0"
      width="1024"
      height="1024"
      fill="#04060F"/>

    <circle
      cx="512"
      cy="512"
      r="470"
      fill="url(#halo)"/>
  </g>

  <!-- NEON SURVIVOR LOGOSU -->
  <g id="mark"
     fill="none"
     stroke-linejoin="round">

    <polygon
      points="761.4,656 512,800 262.6,656 262.6,368 512,224 761.4,368"
      stroke="#22E6FF"
      stroke-width="36"/>

    <polygon
      points="675.9,606.6 512,701.2 348.1,606.6 348.1,417.4 512,322.8 675.9,417.4"
      stroke="#A05CFF"
      stroke-width="29"/>

    <circle
      cx="512"
      cy="512"
      r="150"
      fill="url(#coreGlow)"
      stroke="none"/>

    <circle
      cx="512"
      cy="512"
      r="77"
      fill="#EAF4FF"
      stroke="none"/>

  </g>

</svg>
