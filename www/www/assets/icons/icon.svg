<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON NORYVX</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#02040a;
    display:flex;
    align-items:center;
    justify-content:center;
}

svg{
    width:min(90vw,700px);
    height:auto;
}
</style>
</head>

<body>

<svg viewBox="0 0 1024 1024"
     xmlns="http://www.w3.org/2000/svg">

<defs>

    <linearGradient id="cyanPink"
                    x1="0" y1="0"
                    x2="1" y2="0">
        <stop offset="0%" stop-color="#16e6ff"/>
        <stop offset="50%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#ff199d"/>
    </linearGradient>

    <linearGradient id="cyan"
                    x1="0" y1="0"
                    x2="1" y2="1">
        <stop stop-color="#00eaff"/>
        <stop offset="1" stop-color="#008cff"/>
    </linearGradient>

    <linearGradient id="pink"
                    x1="0" y1="0"
                    x2="1" y2="1">
        <stop stop-color="#ff3bbd"/>
        <stop offset="1" stop-color="#ff006e"/>
    </linearGradient>

    <filter id="glow">
        <feGaussianBlur stdDeviation="8"
                        result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

</defs>

<!-- Arka plan -->

<rect width="1024"
      height="1024"
      fill="#02040a"/>

<!-- HUD dairesi -->

<g fill="none"
   stroke-linecap="round"
   filter="url(#glow)">

    <path d="
        M170 510
        A342 342 0 0 1 512 168"
        stroke="#16e6ff"
        stroke-width="16"/>

    <path d="
        M512 168
        A342 342 0 0 1 854 510"
        stroke="#ff199d"
        stroke-width="16"/>

    <path d="
        M170 510
        A342 342 0 0 0 512 852"
        stroke="#16e6ff"
        stroke-width="10"/>

    <path d="
        M512 852
        A342 342 0 0 0 854 510"
        stroke="#ff199d"
        stroke-width="10"/>

</g>

<!-- Crosshair -->

<g stroke="url(#cyanPink)"
   stroke-width="12"
   filter="url(#glow)">

    <line x1="125" y1="510"
          x2="245" y2="510"/>

    <line x1="779" y1="510"
          x2="899" y2="510"/>

    <line x1="512" y1="90"
          x2="512" y2="175"/>

</g>

<!-- Robot / maske -->

<g stroke="url(#cyanPink)"
   stroke-width="12"
   stroke-linejoin="round"
   fill="#07101d"
   filter="url(#glow)">

    <!-- kafa -->

    <path d="
        M370 350
        L425 270
        L512 235
        L599 270
        L654 350
        L690 570
        L620 735
        L512 790
        L404 735
        L334 570
        Z"/>

    <!-- sol göz -->

    <path d="
        M355 430
        L440 405
        L490 470
        L420 520
        L355 490
        Z"
        fill="#16e6ff"/>

    <!-- sağ göz -->

    <path d="
        M669 430
        L584 405
        L534 470
        L604 520
        L669 490
        Z"
        fill="#ff199d"/>

    <!-- maske -->

    <path d="
        M430 535
        L512 565
        L594 535
        L565 690
        L512 725
        L459 690
        Z"/>

    <!-- sol filtre -->

    <circle cx="385"
            cy="625"
            r="65"/>

    <!-- sağ filtre -->

    <circle cx="639"
            cy="625"
            r="65"/>

    <circle cx="385"
            cy="625"
            r="28"
            fill="none"/>

    <circle cx="639"
            cy="625"
            r="28"
            fill="none"/>

</g>

<!-- NEON -->

<text x="512"
      y="850"
      text-anchor="middle"
      font-family="Arial Black,Arial,sans-serif"
      font-size="120"
      font-weight="900"
      letter-spacing="8"
      fill="url(#cyanPink)"
      filter="url(#glow)">
    NEON
</text>

<!-- NORYVX -->

<text x="512"
      y="920"
      text-anchor="middle"
      font-family="Arial,Helvetica,sans-serif"
      font-size="55"
      font-weight="700"
      letter-spacing="20"
      fill="#ffffff">
    NORYVX
</text>

<!-- Alt sembol -->

<path d="
    M470 950
    L512 995
    L554 950
    L512 970
    Z"
    fill="none"
    stroke="url(#cyanPink)"
    stroke-width="10"
    filter="url(#glow)"/>

</svg>

</body>
</html>
