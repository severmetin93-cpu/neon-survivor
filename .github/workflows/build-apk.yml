name: Build APK — NORYVX V20.0.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor android assets
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Configure Android project (icons, manifest, MainActivity)
        run: node scripts/configure-android.mjs

      - name: Set execute permission on gradlew
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Locate APK
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "APK size: $(du -sh $APK)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-survivor-v20.0.0-release
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Build summary
        run: |
          echo "### NORYVX V20.0.0 APK Build" >> $GITHUB_STEP_SUMMARY
          echo "- **versionCode**: 20" >> $GITHUB_STEP_SUMMARY
          echo "- **versionName**: 20.0.0" >> $GITHUB_STEP_SUMMARY
          echo "- **APK**: ${{ env.APK_PATH }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $(du -sh ${{ env.APK_PATH }} | cut -f1)" >> $GITHUB_STEP_SUMMARY
