name: Build APK — NORYVX V20.0.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor android assets
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Configure Android project (icons, manifest, MainActivity)
        run: node scripts/configure-android.mjs

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/neon-survivor-release.jks

      - name: Set execute permission on gradlew
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PATH: neon-survivor-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Locate and verify APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "APK size: $(du -sh $APK)"
          # Verify APK is signed
          $JAVA_HOME/bin/jarsigner -verify "$APK" && echo "Signature: VALID" || echo "Signature: UNSIGNED"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-survivor-v20.0.0-signed
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Shred keystore from runner
        if: always()
        run: shred -u android/app/neon-survivor-release.jks 2>/dev/null || rm -f android/app/neon-survivor-release.jks

      - name: Build summary
        run: |
          echo "### NORYVX V20.0.0 Signed APK" >> $GITHUB_STEP_SUMMARY
          echo "- **versionCode**: 20" >> $GITHUB_STEP_SUMMARY
          echo "- **versionName**: 20.0.0" >> $GITHUB_STEP_SUMMARY
          echo "- **keyAlias**: ${{ secrets.KEY_ALIAS }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK**: \`${{ env.APK_PATH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $(du -sh ${{ env.APK_PATH }} | cut -f1)" >> $GITHUB_STEP_SUMMARY
