name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify sharp can rasterize the SVG
        run: |
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');

          sharp(
            fs.readFileSync('www/assets/icons/icon.svg'),
            { density: 512 }
          )
          .resize(192, 192)
          .png()
          .toBuffer()
          .then(b => {
            console.log('sharp OK, test PNG:', b.length, 'bytes');
          })
          .catch(e => {
            console.error('sharp SVG render ERROR:', e.message);
            process.exit(1);
          });
          "

      - name: Sanity check
        run: |
          test -f www/index.html || {
            echo "www/index.html yok!";
            exit 1;
          }

          test -f www/assets/icons/icon.svg || {
            echo "www/assets/icons/icon.svg yok!";
            exit 1;
          }

          test -f www/manifest.json || {
            echo "www/manifest.json yok!";
            exit 1;
          }

          test -f www/service-worker.js || {
            echo "www/service-worker.js yok!";
            exit 1;
          }

          test -f capacitor.config.json || {
            echo "capacitor.config.json yok!";
            exit 1;
          }

          echo "Web kaynaklari OK"

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ zaten var, atlaniyor"
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Install required Android SDK platform
        run: |
          COMPILE_SDK=$(grep -oP 'compileSdkVersion\s*=\s*\K[0-9]+' android/variables.gradle || echo "35")

          echo "compileSdkVersion = $COMPILE_SDK"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          sdkmanager \
            "platforms;android-${COMPILE_SDK}" \
            "platform-tools"

      - name: Configure Android project
        run: node scripts/configure-android.mjs

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$SRC" ]; then
            echo "APK bulunamadi!"
            exit 1
          fi

          echo "Bulunan APK: $SRC"

          mkdir -p dist

          cp "$SRC" dist/NEON-SURVIVOR-debug.apk

          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEON-SURVIVOR-debug-apk
          path: dist/NEON-SURVIVOR-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Diagnostic output
        if: failure()
        run: |
          echo "=== ENVIRONMENT ==="
          node --version
          java -version 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "=== variables.gradle ==="
          cat android/variables.gradle || true

          echo "=== AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml || true

          echo "=== styles.xml ==="
          cat android/app/src/main/res/values/styles.xml || true

          echo "=== MainActivity.java ==="
          find android/app/src/main/java \
            -name MainActivity.java \
            -exec cat {} \; || true
