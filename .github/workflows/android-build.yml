name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install --include=dev --no-audit --no-fund
          npm install sharp@0.33.5 --save-dev --include=dev --no-audit --no-fund

      - name: Verify sharp can rasterize the SVG
        run: |
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');

          sharp(fs.readFileSync('www/assets/icons/icon.svg'), { density: 512 })
            .resize(192, 192)
            .png()
            .toBuffer()
            .then(b => {
              console.log('sharp OK, test PNG:', b.length, 'bayt');
            })
            .catch(e => {
              console.error('sharp SVG render HATASI:', e.message);
              process.exit(1);
            });
          "

      - name: Sanity check
        run: |
          test -f www/index.html || {
            echo "HATA: www/index.html yok!"
            exit 1
          }

          test -f www/assets/icons/icon.svg || {
            echo "HATA: www/assets/icons/icon.svg yok!"
            exit 1
          }

          test -f capacitor.config.json || {
            echo "HATA: capacitor.config.json yok!"
            exit 1
          }

          test -f scripts/configure-android.mjs || {
            echo "HATA: scripts/configure-android.mjs yok!"
            exit 1
          }

          echo "Web kaynaklari ve build scriptleri OK."

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ zaten var, atlaniyor."
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Install required Android SDK platform
        run: |
          COMPILE_SDK=$(grep -oP 'compileSdkVersion\s*=\s*\K[0-9]+' android/variables.gradle || echo "35")

          echo "compileSdkVersion = $COMPILE_SDK"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          sdkmanager \
            "platforms;android-${COMPILE_SDK}" \
            "platform-tools"

      - name: Configure Android project
        run: node scripts/configure-android.mjs

      - name: Verify Android configuration
        run: |
          test -f android/app/src/main/AndroidManifest.xml || {
            echo "HATA: AndroidManifest.xml bulunamadi."
            exit 1
          }

          test -f android/app/src/main/java/com/tumes/neonsurvivor/MainActivity.java || {
            echo "HATA: MainActivity.java bulunamadi."
            exit 1
          }

          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || {
            echo "HATA: Adaptive launcher icon bulunamadi."
            exit 1
          }

          echo "Android yapilandirmasi OK."

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$SRC" ]; then
            echo "HATA: APK bulunamadi!"
            exit 1
          fi

          echo "Bulunan APK: $SRC"

          mkdir -p dist
          cp "$SRC" dist/NEON-SURVIVOR-debug.apk

          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEON-SURVIVOR-debug-apk
          path: dist/NEON-SURVIVOR-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Diagnostic output on failure
        if: failure()
        run: |
          echo "========================================"
          echo "BUILD DIAGNOSTIC"
          echo "========================================"

          echo ""
          echo "=== Node ==="
          node --version

          echo ""
          echo "=== npm ==="
          npm --version

          echo ""
          echo "=== Java ==="
          java -version 2>&1

          echo ""
          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo ""
          echo "=== Repository files ==="
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            ! -path "./android/.gradle/*" \
            | sort | head -300

          echo ""
          echo "=== package.json ==="
          cat package.json || true

          echo ""
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json || true

          echo ""
          echo "=== variables.gradle ==="
          cat android/variables.gradle || true

          echo ""
          echo "=== AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "=== MainActivity.java ==="
          find android/app/src/main/java \
            -name MainActivity.java \
            -exec cat {} \; || true

          echo ""
          echo "=== styles.xml ==="
          cat android/app/src/main/res/values/styles.xml || true
