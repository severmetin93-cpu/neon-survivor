name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: |
          npm install --include=dev --no-audit --no-fund

      - name: Install sharp explicitly
        run: |
          npm install --save-dev sharp@0.33.5 --include=dev --no-audit --no-fund
          node -e "console.log('sharp version:', require('sharp').versions.sharp)"

      - name: Verify sharp can rasterize SVG
        run: |
          test -f www/assets/icons/icon.svg || {
            echo "HATA: www/assets/icons/icon.svg bulunamadi!"
            exit 1
          }

          node <<'NODE'
          const fs = require("fs");
          const sharp = require("sharp");

          const input = "www/assets/icons/icon.svg";

          console.log("SVG kontrol ediliyor:", input);

          sharp(fs.readFileSync(input), { density: 512 })
            .resize(192, 192)
            .png()
            .toBuffer()
            .then(buffer => {
              console.log("SVG -> PNG BASARILI");
              console.log("PNG boyutu:", buffer.length, "bytes");
            })
            .catch(error => {
              console.error("SVG -> PNG HATASI:");
              console.error(error);
              process.exit(1);
            });
          NODE

      - name: Sanity check
        run: |
          test -f www/index.html || {
            echo "HATA: www/index.html yok!"
            exit 1
          }

          test -f www/manifest.json || {
            echo "HATA: www/manifest.json yok!"
            exit 1
          }

          test -f www/service-worker.js || {
            echo "HATA: www/service-worker.js yok!"
            exit 1
          }

          test -f www/assets/icons/icon.svg || {
            echo "HATA: www/assets/icons/icon.svg yok!"
            exit 1
          }

          test -f capacitor.config.json || {
            echo "HATA: capacitor.config.json yok!"
            exit 1
          }

          test -f scripts/configure-android.mjs || {
            echo "HATA: scripts/configure-android.mjs yok!"
            exit 1
          }

          echo "================================"
          echo "WEB KAYNAKLARI OK"
          echo "================================"

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "android/ zaten var"
          fi

      - name: Sync web assets
        run: |
          npx cap sync android

      - name: Install required Android SDK platform
        run: |
          COMPILE_SDK=$(grep -oP 'compileSdkVersion\s*=\s*\K[0-9]+' android/variables.gradle || echo "35")

          echo "compileSdkVersion = $COMPILE_SDK"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          sdkmanager \
            "platforms;android-${COMPILE_SDK}" \
            "platform-tools"

      - name: Configure Android
        run: |
          node scripts/configure-android.mjs

      - name: Build debug APK
        run: |
          cd android

          chmod +x ./gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "APK aranıyor..."

          find android/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

      - name: Rename APK
        run: |
          SRC=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$SRC" ]; then
            echo "HATA: APK bulunamadi!"
            exit 1
          fi

          echo "Bulunan APK:"
          echo "$SRC"

          mkdir -p dist

          cp "$SRC" dist/NEON-SURVIVOR-debug.apk

          echo "Final APK:"
          ls -lh dist/NEON-SURVIVOR-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-SURVIVOR-debug-apk
          path: dist/NEON-SURVIVOR-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Diagnostic information
        if: failure()
        run: |
          echo "================================"
          echo "BUILD HATASI - DIAGNOSTIC"
          echo "================================"

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Java:"
          java -version 2>&1

          echo ""
          echo "Sharp:"
          npm list sharp || true

          echo ""
          echo "Files:"
          find www -maxdepth 4 -type f -print || true

          echo ""
          echo "Android variables:"
          cat android/variables.gradle || true
