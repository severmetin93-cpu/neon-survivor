name: NORVYX 3D PBR Sprite Bake

on:
  workflow_dispatch:

env:
  BLENDER_VERSION: "4.2.0"
  BLENDER_DIR: "blender-4.2.0-linux-x64"
  BLENDER_URL: "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz"

jobs:

  # ── Step 1: single test frame ──────────────────────────────────────────────
  test-render:
    name: "Test render — vanguard_00 (2048px)"
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y wget xvfb \
            libxrender1 libxi6 libxkbcommon0 libsm6 libice6 libgl1 \
            libglib2.0-0 libxext6 libxfixes3

      - name: Install Blender 4.2 LTS
        run: |
          wget -q "${{ env.BLENDER_URL }}" -O blender.tar.xz
          tar xf blender.tar.xz
          echo "${GITHUB_WORKSPACE}/${{ env.BLENDER_DIR }}" >> $GITHUB_PATH
          echo "BLENDER_BIN=${GITHUB_WORKSPACE}/${{ env.BLENDER_DIR }}/blender" >> $GITHUB_ENV
          ${GITHUB_WORKSPACE}/${{ env.BLENDER_DIR }}/blender --version

      - name: Test render vanguard_00 (2048×2048)
        run: |
          echo "Rendering vanguard_00 as timing test..."
          START=$(date +%s)
          xvfb-run -a ${BLENDER_BIN} -b --python blender/bake_sprites.py -- --test --ships vanguard
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "Test frame time: ${ELAPSED}s"
          echo "FRAME_TIME=${ELAPSED}" >> $GITHUB_ENV
          ls -lh baked/vanguard_00.png

      - name: Timing report
        run: |
          echo "## Test Render Result" >> $GITHUB_STEP_SUMMARY
          echo "- **Frame:** vanguard_00.png @ 2048×2048" >> $GITHUB_STEP_SUMMARY
          echo "- **Render time:** ${FRAME_TIME}s" >> $GITHUB_STEP_SUMMARY
          PROJECTED=$(( FRAME_TIME * 24 / 60 ))
          echo "- **Projected per-group time:** ~${PROJECTED} min (24 frames)" >> $GITHUB_STEP_SUMMARY
          ls -lh baked/vanguard_00.png >> $GITHUB_STEP_SUMMARY || true

      - name: Upload test frame
        uses: actions/upload-artifact@v4
        with:
          name: test-vanguard-00
          path: baked/vanguard_00.png
          if-no-files-found: error

  # ── Step 2: parallel bake (12 groups × 1 ship × 8 frames = 96 total) ────────
  # ortho_scale=3.5 fills ~30% of canvas → 3× more Cycles work than before.
  # 3 ships/group was ~107 min → timeout. 1 ship/group is ~36 min → safe.
  bake:
    name: "Bake ${{ matrix.ship }}"
    needs: test-render
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    strategy:
      fail-fast: false   # if one ship fails, others continue
      matrix:
        include:
          - ship: "vanguard"
          - ship: "striker"
          - ship: "controller"
          - ship: "scout"
          - ship: "dasher"
          - ship: "hunter"
          - ship: "assault"
          - ship: "elite"
          - ship: "tank"
          - ship: "weaver"
          - ship: "orbiter"
          - ship: "boss"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y wget xvfb \
            libxrender1 libxi6 libxkbcommon0 libsm6 libice6 libgl1 \
            libglib2.0-0 libxext6 libxfixes3

      - name: Install Blender 4.2 LTS
        run: |
          wget -q "${{ env.BLENDER_URL }}" -O blender.tar.xz
          tar xf blender.tar.xz
          echo "${GITHUB_WORKSPACE}/${{ env.BLENDER_DIR }}" >> $GITHUB_PATH
          echo "BLENDER_BIN=${GITHUB_WORKSPACE}/${{ env.BLENDER_DIR }}/blender" >> $GITHUB_ENV

      - name: Bake ${{ matrix.ship }} (8 frames)
        run: |
          echo "Baking ship: ${{ matrix.ship }}"
          xvfb-run -a ${BLENDER_BIN} -b \
            --python blender/bake_sprites.py \
            -- --ships "${{ matrix.ship }}"
          echo "Baked PNGs:"
          ls baked/*.png | wc -l
          ls baked/*.png

      - name: Verify ship output
        run: |
          COUNT=$(ls baked/*.png 2>/dev/null | wc -l)
          EXPECTED=8  # 1 ship × 8 frames
          echo "Baked: ${COUNT} / Expected: ${EXPECTED}"
          if [ "${COUNT}" -lt "${EXPECTED}" ]; then
            echo "ERROR: Expected ${EXPECTED} PNGs, got ${COUNT}"
            exit 1
          fi

      - name: Upload ship artifact
        uses: actions/upload-artifact@v4
        with:
          name: baked-masters-${{ matrix.ship }}
          path: baked/*.png
          if-no-files-found: error
          retention-days: 7

  # ── Step 3: merge + atlas + final artifact ─────────────────────────────────
  finalize:
    name: "Finalize — merge + atlas + game sprites"
    needs: bake
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip3 install pillow

      - name: Download all ship artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: baked-masters-*
          path: baked-raw/
          merge-multiple: false

      - name: Merge all PNGs into baked/
        run: |
          mkdir -p baked
          find baked-raw/ -name "*.png" -exec cp {} baked/ \;
          echo "Total master PNGs merged:"
          ls baked/*.png | wc -l
          ls baked/

      - name: Verify complete output (96 frames)
        run: |
          COUNT=$(ls baked/*.png | wc -l)
          echo "Total: ${COUNT} / Expected: 96"
          if [ "${COUNT}" -lt 96 ]; then
            echo "WARNING: Only ${COUNT}/96 frames present — some groups may have failed"
          fi

      - name: Build atlas and rename game sprites
        run: |
          python3 blender/build_atlas.py
          echo "Game sprites:"
          ls baked/ships/
          echo "Atlas files:"
          ls -lh baked/atlas-units.png baked/atlas-units.json

      - name: Upload final game sprites artifact
        uses: actions/upload-artifact@v4
        with:
          name: norvyx-baked-sprites
          path: |
            baked/ships/
            baked/atlas-units.png
            baked/atlas-units.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload all 2048px master PNGs
        uses: actions/upload-artifact@v4
        with:
          name: norvyx-baked-masters-2048
          path: baked/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          echo "## NORVYX 3D PBR Bake — Final Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Blender | 4.2.0 LTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Resolution | 2048×2048 RGBA |" >> $GITHUB_STEP_SUMMARY
          echo "| Engine | Cycles/CPU + OIDN denoise |" >> $GITHUB_STEP_SUMMARY
          MASTERS=$(ls baked/*.png 2>/dev/null | wc -l)
          echo "| Master PNGs | ${MASTERS} / 96 |" >> $GITHUB_STEP_SUMMARY
          GAME=$(ls baked/ships/*.png 2>/dev/null | wc -l)
          echo "| Game sprites | ${GAME} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Game sprites (assets/ships/)" >> $GITHUB_STEP_SUMMARY
          ls baked/ships/ | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
