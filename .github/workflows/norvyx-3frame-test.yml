name: NORVYX 3-Frame Camera+Material Test

on:
  workflow_dispatch:

env:
  BLENDER_VERSION: "4.2.0"
  BLENDER_DIR: "blender-4.2.0-linux-x64"
  BLENDER_URL: "https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz"

jobs:
  test-3frame:
    name: "3-frame test — vanguard_00 / hunter_00 / boss_00"
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y wget xvfb \
            libxrender1 libxi6 libxkbcommon0 libsm6 libice6 libgl1 \
            libglib2.0-0 libxext6 libxfixes3
          pip3 install pillow

      - name: Install Blender 4.2 LTS
        run: |
          wget -q "${{ env.BLENDER_URL }}" -O blender.tar.xz
          tar xf blender.tar.xz
          echo "${GITHUB_WORKSPACE}/${{ env.BLENDER_DIR }}" >> $GITHUB_PATH
          echo "BLENDER_BIN=${GITHUB_WORKSPACE}/${{ env.BLENDER_DIR }}/blender" >> $GITHUB_ENV
          ${GITHUB_WORKSPACE}/${{ env.BLENDER_DIR }}/blender --version

      - name: Render vanguard_00 + hunter_00 + boss_00 (2048×2048)
        run: |
          echo "Rendering 3 test frames with ortho_scale=3.5 + fixed materials..."
          START=$(date +%s)
          xvfb-run -a ${BLENDER_BIN} -b \
            --python blender/bake_sprites.py \
            -- --test --ships vanguard,hunter,boss
          END=$(date +%s)
          echo "Total render time: $((END - START))s"
          echo "Output files:"
          ls -lh baked/*.png

      - name: Measure opaque pixel ratios (Pillow)
        run: |
          python3 - <<'PYEOF'
          import os
          from PIL import Image

          for name in ['vanguard', 'hunter', 'boss']:
              path = f'baked/{name}_00.png'
              if not os.path.exists(path):
                  print(f'{name}_00: NOT FOUND')
                  continue
              img = Image.open(path).convert('RGBA')
              w, h = img.size
              alpha = list(img.getchannel('A').getdata())
              total = w * h
              opaque = sum(1 for a in alpha if a > 10)
              pct = opaque * 100.0 / total
              size_kb = os.path.getsize(path) // 1024
              print(f'{name}_00: {w}x{h} | {size_kb}KB | opaque={pct:.1f}%')
          PYEOF

      - name: Framing sanity check (Pillow)
        run: |
          python3 - <<'PYEOF'
          import os, sys
          from PIL import Image

          TARGETS = {
              'vanguard': (20.0, 35.0),
              'hunter':   (15.0, 30.0),
              'boss':     (35.0, 55.0),
          }

          def opaque_pct(path):
              img = Image.open(path).convert('RGBA')
              w, h = img.size
              alpha = list(img.getchannel('A').getdata())
              opaque = sum(1 for a in alpha if a > 10)
              return opaque * 100.0 / (w * h)

          passed = True
          results = []
          for name, (lo, hi) in TARGETS.items():
              path = f'baked/{name}_00.png'
              if not os.path.exists(path):
                  results.append(f'FAIL  {name}: file missing')
                  passed = False
                  continue
              pct = opaque_pct(path)
              status = 'PASS' if lo <= pct <= hi else 'WARN'
              if pct < lo * 0.5:   # only hard-fail if catastrophically low
                  status = 'FAIL'
                  passed = False
              results.append(f'{status}  {name}: {pct:.1f}% (target {lo:.0f}–{hi:.0f}%)')

          for r in results:
              print(r)

          if not passed:
              print('\nFRAMING TEST: FAIL — do not start full bake')
              sys.exit(1)
          else:
              print('\nFRAMING TEST: PASS — safe to start full 96-frame bake')
          PYEOF

      - name: Upload test frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norvyx-3frame-test
          path: baked/*.png
          if-no-files-found: warn
          retention-days: 3

      - name: Summary
        if: always()
        run: |
          echo "## NORVYX 3-Frame Camera+Material Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Old | New |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| ortho_scale | 8.6 | 3.5 |" >> $GITHUB_STEP_SUMMARY
          echo "| NVX_Dark base | (0.012, 0.018, 0.028) | (0.060, 0.075, 0.100) |" >> $GITHUB_STEP_SUMMARY
          echo "| NVX_Carbon base | (0.035, 0.045, 0.060) | (0.090, 0.100, 0.130) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test frames" >> $GITHUB_STEP_SUMMARY
          ls -lh baked/*.png 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
